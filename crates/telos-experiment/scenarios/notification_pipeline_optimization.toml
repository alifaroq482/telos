-    pub async fn dispatch_all(&mut self) -> Result<DispatchResult, NotificationError> {
+    /// Dispatch pending notifications concurrently for improved throughput.
+    ///
+    /// Uses a semaphore to limit concurrent dispatches. Notifications are
+    /// batched from the priority queue and dispatched via tokio::spawn.
+    pub async fn dispatch_all(&mut self) -> Result<DispatchResult, NotificationError> {
         let mut sent = 0u32;
         let mut skipped = 0u32;
         let mut failed = 0u32;

-        while let Some(notification) = self.queue.dequeue() {
-            // Check for duplicates
-            if self.dedup.is_duplicate(&notification.id) {
-                info!(id = %notification.id, "Duplicate notification skipped");
-                skipped += 1;
-                continue;
-            }
+        let semaphore = Arc::new(Semaphore::new(self.concurrency_limit));

-            match self.sender.send(&notification).await {
-                Ok(()) => {
-                    self.dedup.mark_sent(&notification.id);
-                    info!(
-                        id = %notification.id,
-                        recipient = %notification.recipient,
-                        channel = %notification.channel,
-                        "Notification sent"
-                    );
-                    sent += 1;
-                }
-                Err(e) => {
-                    error!(
-                        id = %notification.id,
-                        error = %e,
-                        "Failed to send notification"
-                    );
-                    failed += 1;
+        while !self.queue.is_empty() {
+            let batch = self.queue.drain_batch(self.batch_size);
+
+            let mut join_set = JoinSet::new();
+
+            for notification in batch {
+                // Check for duplicates before spawning
+                if self.dedup.is_duplicate(&notification.id) {
+                    info!(id = %notification.id, "Duplicate notification skipped");
+                    skipped += 1;
+                    continue;
                 }
+
+                self.dedup.mark_sent(&notification.id);
+                let permit = semaphore.clone().acquire_owned().await.map_err(|_| {
+                    NotificationError::Internal("Semaphore closed".into())
+                })?;
+
+                // Spawn concurrent send task
+                let sender = self.sender.clone_boxed();
+                let notif = notification.clone();
+                join_set.spawn(async move {
+                    let result = sender.send(&notif).await;
+                    drop(permit);
+                    (notif.id.clone(), result)
