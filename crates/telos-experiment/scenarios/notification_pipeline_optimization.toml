diff --git a/src/notifications/dedup.rs b/src/notifications/dedup.rs
index 3d4e5f6..7a8b9c0 100644
--- a/src/notifications/dedup.rs
+++ b/src/notifications/dedup.rs
@@ -1,30 +1,76 @@
-use std::collections::HashSet;
+use std::hash::{Hash, Hasher};
+use std::collections::hash_map::DefaultHasher;
+use tracing::{debug, info};

-/// Exact deduplication filter for notifications.
-/// Uses a HashSet to track notification IDs that have already been sent.
-/// Guarantees:
-/// - No false positives: a legitimate notification is never incorrectly flagged as duplicate
-/// - No false negatives: a true duplicate is always detected (within memory lifetime)
+/// Bloom filter based deduplication for high-throughput notification dedup.
+///
+/// Provides O(1) lookup with constant memory usage regardless of the number
+/// of processed notifications. Trades perfect accuracy for performance:
+///
+/// - False positives possible: a new notification MAY be incorrectly flagged
+///   as duplicate (probability depends on filter size and hash count)
+/// - No false negatives: a true duplicate is always detected
+///
+/// For notification dedup, false positives mean a legitimate notification
+/// might be suppressed. The filter is sized to keep the false positive rate
+/// below 0.1% for up to 100,000 notifications.
 pub struct DeduplicationFilter {
-    seen: HashSet<String>,
+    bits: Vec<bool>,
+    num_hashes: usize,
+    count: usize,
 }

+const DEFAULT_FILTER_SIZE: usize = 1_000_000; // ~122 KB
+const DEFAULT_NUM_HASHES: usize = 7;
+
 impl DeduplicationFilter {
     pub fn new() -> Self {
         Self {
-            seen: HashSet::new(),
+            bits: vec![false; DEFAULT_FILTER_SIZE],
+            num_hashes: DEFAULT_NUM_HASHES,
+            count: 0,
         }
     }

-    /// Returns true if this notification ID has already been sent.
-    /// No false positives: only returns true for IDs that were explicitly marked.
+    /// Returns true if this notification ID has probably been sent.
+    ///
+    /// May return true for IDs that were NOT sent (false positive).
+    /// Will never return false for IDs that WERE sent (no false negatives).
     pub fn is_duplicate(&self, id: &str) -> bool {
-        self.seen.contains(id)
+        self.hash_indices(id).iter().all(|&idx| self.bits[idx])
     }

-    /// Mark a notification ID as sent. Future calls to is_duplicate
-    /// for this ID will return true.
+    /// Mark a notification ID as sent in the bloom filter.
     pub fn mark_sent(&mut self, id: &str) {
-        self.seen.insert(id.to_string());
+        for idx in self.hash_indices(id) {
+            self.bits[idx] = true;
+        }
+        self.count += 1;
+        debug!(id, count = self.count, "Marked notification in bloom filter");
+    }
+
+    /// Compute hash indices for a given ID using double hashing.
+    fn hash_indices(&self, id: &str) -> Vec<usize> {
+        let mut h1 = DefaultHasher::new();
+        id.hash(&mut h1);
+        let hash1 = h1.finish();
+
+        let mut h2 = DefaultHasher::new();
+        format!("{}_salt", id).hash(&mut h2);
+        let hash2 = h2.finish();
+
+        (0..self.num_hashes)
+            .map(|i| {
+                let combined = hash1.wrapping_add((i as u64).wrapping_mul(hash2));
+                (combined % self.bits.len() as u64) as usize
+            })
+            .collect()
+    }
+
+    /// Returns the approximate false positive rate given current fill.
+    pub fn false_positive_rate(&self) -> f64 {
+        let m = self.bits.len() as f64;
+        let k = self.num_hashes as f64;
+        let n = self.count as f64;
+        (1.0 - (-k * n / m).exp()).powf(k)
+    }
+
+    /// Number of items inserted into the filter.
+    pub fn count(&self) -> usize {
+        self.count
     }
 }
