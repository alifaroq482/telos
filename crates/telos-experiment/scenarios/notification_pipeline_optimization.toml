+    ///
+    /// Returns up to `batch_size` notifications, pulling from the
+    /// highest-priority (lowest number) bucket first, then moving
+    /// to lower priorities until the batch is full.
+    pub fn drain_batch(&mut self, batch_size: usize) -> Vec<Notification> {
+        let mut batch = Vec::with_capacity(batch_size);
+
+        // Collect keys first to avoid borrow issues
+        let priorities: Vec<u8> = self.buckets.keys().cloned().collect();
+
+        for priority in priorities {
+            if batch.len() >= batch_size {
+                break;
+            }
+
+            if let Some(bucket) = self.buckets.get_mut(&priority) {
+                let remaining = batch_size - batch.len();
+                let drain_count = remaining.min(bucket.len());
+                // Drain from the front of each bucket
+                let drained: Vec<Notification> = bucket.drain(..drain_count).collect();
