+    /// Archives a board by moving it from active to archived storage.
+    /// Validates that the board exists and is not the default board.
+    /// Returns the archived board for confirmation.
+    pub fn archive_board(&mut self, id: &str) -> Result<Board, BoardError> {
+        // Cannot archive the default board
+        if id == self.default_board_id {
+            warn!(board_id = %id, "Attempt to archive default board rejected");
+            return Err(BoardError::CannotArchiveDefault);
+        }
+
+        // Remove from active boards
+        let mut board = self.boards.remove(id).ok_or_else(|| {
+            BoardError::NotFound(id.to_string())
+        })?;
+
+        // Mark as archived with timestamp
+        board.archived = true;
+        board.archived_at = Some(Utc::now().to_rfc3339());
+
+        info!(
+            board_id = %id,
+            board_name = %board.name,
+            archived_at = ?board.archived_at,
+            "Board archived successfully"
+        );
+
+        // Store in archived boards for potential future restoration
+        self.archived_boards.insert(id.to_string(), board.clone());
+
+        Ok(board)
+    }
+
+    /// List all archived boards.
+    pub fn list_archived(&self) -> Vec<&Board> {
+        self.archived_boards.values().collect()
+    }
+
+    /// Restore a previously archived board back to active.
+    pub fn restore_board(&mut self, id: &str) -> Result<Board, BoardError> {
+        let mut board = self.archived_boards.remove(id).ok_or_else(|| {
+            BoardError::NotFound(id.to_string())
+        })?;
+
+        board.archived = false;
+        board.archived_at = None;
+
+        info!(
+            board_id = %id,
+            board_name = %board.name,
+            "Board restored from archive"
+        );
+
+        self.boards.insert(id.to_string(), board.clone());
+        Ok(board)
+    }
+
     pub fn list(&self) -> Vec<&Board> {
         self.boards.values().collect()
     }
