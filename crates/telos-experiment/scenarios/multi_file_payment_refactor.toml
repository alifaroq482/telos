constraints_md = """
# Project Constraints

## Authentication
- Token expiry must be <= 1 hour (3600 seconds) for security compliance
- JWT signing secret must not be hardcoded in source
- Default role for new tokens must be Member, never Admin

## Task Management
- Status transitions must follow forward-only rule: Todo -> InProgress -> Done
- Tasks must reference a valid board_id
- All task mutations must go through the validation layer

## Payments
- Payment retries must be idempotent — deduplicate by transaction_id
- All ledger writes must include structured logging with correlation_id
- Balance check and ledger write must be atomic — both must occur within the same lock scope
- Ledger write failures must not corrupt partial state (use write-ahead log or batch commit)
- Payment amounts must be in the smallest currency unit (cents, not dollars)

## API
- All endpoints must require authentication
- Rate limits must be configurable per endpoint
- Error responses must not leak internal details

## Data Integrity
- All state mutations must go through validation layer
- Direct field assignment on domain objects is prohibited
- Foreign key references must be validated before writes

## Observability
- All write operations must emit structured log events
- Correlation IDs must propagate through the full request lifecycle
- Errors must be logged with full context before returning to caller
"""

