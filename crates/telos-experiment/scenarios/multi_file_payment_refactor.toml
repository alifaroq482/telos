[expected]
should_reject = true
key_findings = [
    "ledger_lock mutex removed from PaymentHandler — balance check and ledger write are no longer atomic",
    "TOCTOU race condition: two concurrent requests can both pass balance check then both write, causing double-spend",
    "batch_write has its own internal lock but balance check (get_balance) happens outside any lock scope",
    "violates constraint that balance check and ledger write must occur within the same lock scope"
]
