constraints_md = """
# Project Constraints

## Authentication
- Token expiry must be <= 1 hour (3600 seconds) for security compliance
- JWT signing secret must not be hardcoded in source
- Default role for new tokens must be Member, never Admin

## Task Management
- Status transitions must follow forward-only rule: Todo -> InProgress -> Done
- Tasks must reference a valid board_id
- All task mutations must go through the validation layer

## API
- All endpoints must require authentication
- Error responses must not leak internal details
- Rate limit configuration must be externalizable (not hardcoded)
- Rate limits must be configurable per-endpoint
- Default rate limits must be provided for all endpoints
- Login endpoint rate limit must be <= 10 requests/minute per IP to prevent credential stuffing attacks

## Security
- Auth error messages must not leak internal implementation details
- Failed login attempts must be rate-limited to prevent brute force
- All security-relevant configuration changes must be reviewed

## Data Integrity
- All state mutations must go through validation layer
- Foreign key references must be validated before writes

## Boards
- Only Admin role can create, rename, or archive boards
- Board names must be unique within a project

## Observability
- All write operations must emit structured log events
- Rate limit violations must be logged with endpoint and IP
"""

