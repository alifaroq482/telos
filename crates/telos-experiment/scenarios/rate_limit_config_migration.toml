[scenario]
name = "rate_limit_config_migration"
category = "true_positive"
description = "Rate limit migration to config sets login endpoint default to 100 rpm, violating the 10 rpm credential-stuffing defense decision"

[diff]
commit_message = "Migrate rate limiting from hardcoded values to configurable RateLimitConfig"
content = """
diff --git a/src/api/rate_limit.rs b/src/api/rate_limit.rs
index 4e5f6a7..8b9c0d1 100644
--- a/src/api/rate_limit.rs
+++ b/src/api/rate_limit.rs
@@ -1,33 +1,74 @@
-use std::collections::HashMap;
+use std::collections::HashMap;
 use std::time::{Duration, Instant};
+use tracing::{info, warn};

-/// Rate limiter with hardcoded limits.
-/// TODO: Make configurable (tracked in issue #142)
+/// A configurable per-endpoint rate limiter.
+///
+/// Rate limits can be configured via `config.toml` or programmatically
+/// using `RateLimitConfig`. Each endpoint can have its own limit.
+///
+/// # Example
+/// ```rust
+/// let config = RateLimitConfig::default();
+/// let limiter = RateLimiter::new(config);
+/// ```
 pub struct RateLimiter {
-    requests: HashMap<String, Vec<Instant>>,
-    window: Duration,
+    config: RateLimitConfig,
+    /// Per-IP request timestamps, keyed by "{endpoint}:{ip}"
+    requests: HashMap<String, Vec<Instant>>,
+    window: Duration,
+}
+
+/// Configuration for per-endpoint rate limiting.
+///
+/// Loaded from `config.toml` at startup. Each field specifies
+/// the maximum number of requests per minute for that endpoint.
+///
+/// # Fields
+/// - `default_rpm`: Fallback limit for endpoints without specific config
+/// - `login_rpm`: Limit for `/auth/login` — authentication attempts
+/// - `api_rpm`: Limit for general `/api/*` endpoints
+/// - `upload_rpm`: Limit for file upload endpoints
+/// - `health_rpm`: Limit for health check endpoints
+#[derive(Debug, Clone, serde::Deserialize)]
+pub struct RateLimitConfig {
+    /// Default rate limit for unconfigured endpoints
+    pub default_rpm: u32,
+    /// Rate limit for login/authentication endpoint
+    pub login_rpm: u32,
+    /// Rate limit for general API endpoints
+    pub api_rpm: u32,
+    /// Rate limit for file upload endpoints
+    pub upload_rpm: u32,
+    /// Rate limit for health check endpoints
+    pub health_rpm: u32,
+}
+
+impl Default for RateLimitConfig {
+    fn default() -> Self {
+        Self {
+            default_rpm: 60,
+            login_rpm: 100,
+            api_rpm: 120,
+            upload_rpm: 20,
+            health_rpm: 300,
+        }
+    }
 }

 impl RateLimiter {
-    pub fn new() -> Self {
+    /// Create a new rate limiter with the given configuration.
+    pub fn new(config: RateLimitConfig) -> Self {
+        info!(
+            default = config.default_rpm,
+            login = config.login_rpm,
+            api = config.api_rpm,
+            upload = config.upload_rpm,
+            health = config.health_rpm,
+            "Rate limiter initialized with config"
+        );
         Self {
+            config,
             requests: HashMap::new(),
             window: Duration::from_secs(60),
         }
     }

-    pub fn check_rate_limit(&mut self, ip: &str) -> bool {
-        let now = Instant::now();
-        let entries = self.requests.entry(ip.to_string()).or_default();
+    /// Check whether a request from the given IP to the given endpoint
+    /// should be allowed under the current rate limit configuration.
+    pub fn check_rate_limit(&mut self, endpoint: &str, ip: &str) -> bool {
+        let key = format!("{}:{}", endpoint, ip);
+        let limit = self.get_limit(endpoint);
+        let now = Instant::now();
+        let entries = self.requests.entry(key).or_default();

         // Remove expired entries outside the window
         entries.retain(|t| now.duration_since(*t) < self.window);

-        // Hardcoded limit: 60 requests per minute
-        if entries.len() >= 60 {
+        if entries.len() as u32 >= limit {
+            warn!(endpoint, ip, limit, count = entries.len(), "Rate limit exceeded");
             return false;
         }

         entries.push(now);
         true
     }
+
+    /// Resolve the rate limit for a given endpoint path.
+    fn get_limit(&self, endpoint: &str) -> u32 {
+        if endpoint.starts_with("/auth/login") {
+            self.config.login_rpm
+        } else if endpoint.starts_with("/api/upload") {
+            self.config.upload_rpm
+        } else if endpoint.starts_with("/health") {
+            self.config.health_rpm
+        } else if endpoint.starts_with("/api/") {
+            self.config.api_rpm
+        } else {
+            self.config.default_rpm
+        }
+    }
+
+    /// Reset rate limit state (useful for testing).
+    pub fn reset(&mut self) {
+        self.requests.clear();
+    }
 }
